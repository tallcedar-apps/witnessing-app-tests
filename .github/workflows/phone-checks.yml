# Phone checks for My Witnessing Notes (https://tallcedar-apps.github.io/witnessing-app/).
# Lives in the separate PUBLIC repo tallcedar-apps/witnessing-app-tests. Uses only free GitHub-hosted runners.
# Read-only: it checks out the app's code and tests a copy served on this runner's own localhost.
# It never pushes, never deploys, never touches GitHub Pages, and uses no secrets.
name: Phone checks

on:
  push:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "App branch, tag, or full 40-character commit ID to test (from tallcedar-apps/witnessing-app); short commit IDs are refused"
        required: false
        default: main
        type: string
      expected_version:
        description: "Version the app should say, like 0.12 (leave empty to use what the app's index.html says)"
        required: false
        default: ""
        type: string
  # Optional daily run. To turn it on, remove the # from the next two lines.
  # schedule:
  #   - cron: "17 10 * * *"   # every day at 10:17 UTC

permissions:
  contents: read

concurrency:
  # One run at a time per branch AND app_ref, so a push doesn't cancel a manual run of a different app_ref.
  group: phone-checks-${{ github.ref }}-${{ inputs.app_ref || 'main' }}
  cancel-in-progress: true

env:
  APP_REPO: tallcedar-apps/witnessing-app
  APP_REF: ${{ inputs.app_ref || 'main' }}
  EXPECTED_INPUT: ${{ inputs.expected_version }}
  APP_PORT: "8931"          # local test server port (never 8765)
  # Older app version used for the "update" check (checklist step 1): version 0.10, read-only from GitHub.
  OLD_REF: c0b4cad4d4f93aca04eeef2505a634c5fe35caaa
  FORCE_COLOR: "0"

jobs:
  browser-checks:
    name: Chromium and WebKit at phone size (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the inputs
        id: inputs
        # Typed-in inputs reach scripts only through env. Reject anything that isn't a plain ref or version number.
        run: |
          [[ "$APP_REF" =~ ^[A-Za-z0-9._/-]{1,100}$ && "$APP_REF" != -* && "$APP_REF" != *..* ]] || { echo "::error::Bad app_ref (letters, digits, . _ / - only, up to 100)"; exit 1; }
          # A commit must be given in full (40 characters): a short one like c0b3e2f makes the app checkout fail later.
          if [[ "$APP_REF" =~ ^[0-9a-fA-F]{4,39}$ || "$APP_REF" =~ ^[0-9a-fA-F]{41,}$ ]]; then echo "::error::app_ref '$APP_REF' looks like a shortened commit ID. Use the full 40-character commit ID, or a branch or tag name (like main)."; exit 1; fi
          [[ -z "$EXPECTED_INPUT" || "$EXPECTED_INPUT" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Bad expected_version (like 0.12 or 0.12.1, or empty)"; exit 1; }
      - name: Get the tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get the app (${{ env.APP_REF }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app
          persist-credentials: false
      - name: Check the app version
        id: ver
        run: bash ci/app-version.sh app "$EXPECTED_INPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Start the local test server
        run: bash ci/start-server.sh app "$APP_PORT"
      - name: Checklist in Chromium (Android size, stand-in file picker)
        env:
          ENGINE: chromium
          EXPECTED_VERSION: ${{ steps.ver.outputs.version }}
          APP_URL: http://localhost:${{ env.APP_PORT }}/witnessing-app/
          OUT: results/chromium
        run: node tests/run-browser.js
      - name: Checklist in WebKit (iPhone size; WebKit, not real Safari)
        if: ${{ !cancelled() && steps.ver.outcome == 'success' }}
        env:
          ENGINE: webkit
          EXPECTED_VERSION: ${{ steps.ver.outputs.version }}
          APP_URL: http://localhost:${{ env.APP_PORT }}/witnessing-app/
          OUT: results/webkit
        run: node tests/run-browser.js
      - name: Save screenshots and test files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-checks
          path: results/
          retention-days: 7
          if-no-files-found: ignore

  android-emulator:
    name: Real Chrome in the Android emulator (Linux, KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 55  # room for the Play Store fallback after a slow first boot
    steps:
      - name: Check the inputs
        id: inputs
        # Typed-in inputs reach scripts only through env. Reject anything that isn't a plain ref or version number.
        run: |
          [[ "$APP_REF" =~ ^[A-Za-z0-9._/-]{1,100}$ && "$APP_REF" != -* && "$APP_REF" != *..* ]] || { echo "::error::Bad app_ref (letters, digits, . _ / - only, up to 100)"; exit 1; }
          # A commit must be given in full (40 characters): a short one like c0b3e2f makes the app checkout fail later.
          if [[ "$APP_REF" =~ ^[0-9a-fA-F]{4,39}$ || "$APP_REF" =~ ^[0-9a-fA-F]{41,}$ ]]; then echo "::error::app_ref '$APP_REF' looks like a shortened commit ID. Use the full 40-character commit ID, or a branch or tag name (like main)."; exit 1; fi
          [[ -z "$EXPECTED_INPUT" || "$EXPECTED_INPUT" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Bad expected_version (like 0.12 or 0.12.1, or empty)"; exit 1; }
      - name: Get the tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get the app (${{ env.APP_REF }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app
          persist-credentials: false
      - name: Check the app version
        id: ver
        run: bash ci/app-version.sh app "$EXPECTED_INPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Playwright (no browsers needed; it drives the emulator's Chrome)
        run: npm ci
      - name: Start the local test server
        run: bash ci/start-server.sh app "$APP_PORT"
      - name: Turn on hardware speed-up for the emulator (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30 || true
          # Check that KVM is really usable before starting the emulator. (In run 41005227489 this job's copy of the
          # step was missing its last two lines, so the negative-check emulator ran without KVM: a 13-minute boot and
          # a Chrome start that timed out.)
          ls -l /dev/kvm || true
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then echo "KVM hardware speed-up is ready."; else echo "::error::KVM hardware speed-up is not usable on this runner, so the emulator would be far too slow to test with."; exit 1; fi
      # System image: google_apis (API 34, x86_64) is expected to include Chrome. If it doesn't, android-checks.sh
      # exits 3 and writes results/android-chrome-missing.txt; the next step then retries once on
      # google_apis_playstore, which always includes Chrome. Any other failure fails the job as usual.
      - name: Checklist in the Android emulator's Chrome (google_apis image)
        id: emu
        continue-on-error: true   # only so the Play Store fallback can run; the "Result" step below fails the job
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          EXPECTED_VERSION: ${{ steps.ver.outputs.version }}
          ANDROID_IMAGE: google_apis
          ANDROID_OUT: results/android
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          ram-size: 4096M      # more memory for the emulator so Chrome isn't short of it
          heap-size: 576M
          # -feature -Vulkan: in 3 of 6 Android tries (runs 2 and 5, twice) the emulator program died while Chrome was being closed (last line: a
          # Vulkan device being set up, with no matching "Destroyed VkDevice"). Chrome then draws with OpenGL ES instead.
          # (Run 6, with Vulkan off, still lost the emulator once, during the negative check; so this is not proven to help.)
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -feature -Vulkan
          script: bash ci/android-checks.sh
      - name: Fallback — Chrome was missing, so retry on the google_apis_playstore image
        id: emu_playstore
        if: ${{ !cancelled() && steps.emu.outcome == 'failure' && hashFiles('results/android-chrome-missing.txt') != '' }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          EXPECTED_VERSION: ${{ steps.ver.outputs.version }}
          ANDROID_IMAGE: google_apis_playstore
          ANDROID_OUT: results/android-playstore
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          ram-size: 4096M      # more memory for the emulator so Chrome isn't short of it
          heap-size: 576M
          # -feature -Vulkan: in 3 of 6 Android tries (runs 2 and 5, twice) the emulator program died while Chrome was being closed (last line: a
          # Vulkan device being set up, with no matching "Destroyed VkDevice"). Chrome then draws with OpenGL ES instead.
          # (Run 6, with Vulkan off, still lost the emulator once, during the negative check; so this is not proven to help.)
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -feature -Vulkan
          script: bash ci/android-checks.sh
      # Only when the emulator PROGRAM itself vanished mid-run (results/android/emulator-gone.txt exists; never for an
      # ordinary FAIL): run the whole checklist once more on a brand-new emulator. Every check runs again and must
      # pass; the run page shows a warning, and the first try's results stay in the artifacts (results/android).
      - name: Retry once on a new emulator — only because the emulator program itself vanished
        id: emu_retry
        if: ${{ !cancelled() && steps.emu.outcome == 'failure' && hashFiles('results/android/emulator-gone.txt') != '' && hashFiles('results/android-chrome-missing.txt') == '' }}
        continue-on-error: true   # the "Result" step below decides
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          EXPECTED_VERSION: ${{ steps.ver.outputs.version }}
          ANDROID_IMAGE: google_apis
          ANDROID_OUT: results/android-retry
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          ram-size: 4096M
          heap-size: 576M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -feature -Vulkan
          script: bash ci/android-checks.sh
      - name: Result of the Android checks
        # Not when the inputs were refused (nothing ran, so there is nothing to report beyond that error).
        if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
        env:
          EMU: ${{ steps.emu.outcome }}
          FALLBACK: ${{ steps.emu_playstore.outcome }}
          RETRY: ${{ steps.emu_retry.outcome }}
        run: |
          if [[ "$EMU" == "success" ]]; then echo "Android checks passed on google_apis."; exit 0; fi
          if [[ -f results/android/emulator-gone.txt && ! -f results/android-chrome-missing.txt ]]; then
            echo "::warning::The Android emulator program vanished during the first try (see results/android/emulator-gone.txt); the whole checklist was run again on a new emulator."
            if [[ "$RETRY" == "success" ]]; then echo "Android checks passed on the second, new emulator (all checks re-run)."; exit 0; fi
            echo "::error::Android checks failed on the second emulator too ($RETRY)."; exit 1
          fi
          if [[ -f results/android-chrome-missing.txt ]]; then
            echo "::warning::Chrome was missing on google_apis; used google_apis_playstore instead."
            if [[ "$FALLBACK" == "success" ]]; then echo "Android checks passed on google_apis_playstore."; exit 0; fi
            echo "::error::Android checks failed on google_apis_playstore ($FALLBACK)."; exit 1
          fi
          echo "::error::Android checks failed on google_apis ($EMU)."; exit 1
      - name: Save the emulator's own crash files (only if something failed)
        # Diagnostics only: the emulator's crash report folder (emu-crash-*.db, with any minidumps) and its network
        # helper's logs. The emulator's own printed output is in this job's log (lines starting INFO / WARNING / ERROR).
        if: ${{ !cancelled() && (steps.emu.outcome == 'failure' || steps.emu_playstore.outcome == 'failure' || steps.emu_retry.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-files
          path: /tmp/android-runner/
          retention-days: 7
          if-no-files-found: ignore
      - name: Save screenshots and test files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator
          path: results/
          retention-days: 7
          if-no-files-found: ignore

  android-negative-crash:
    name: Negative check — a page-crashing copy of the app must FAIL (own Android emulator)
    # Its own job with its own fresh emulator, so it can't disturb (or be disturbed by) the main Android checks.
    # Not retried: one try only, and it passes only when a page crash is seen with no emulator or adb trouble.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the inputs
        id: inputs
        # Typed-in inputs reach scripts only through env. Reject anything that isn't a plain ref or version number.
        run: |
          [[ "$APP_REF" =~ ^[A-Za-z0-9._/-]{1,100}$ && "$APP_REF" != -* && "$APP_REF" != *..* ]] || { echo "::error::Bad app_ref (letters, digits, . _ / - only, up to 100)"; exit 1; }
          # A commit must be given in full (40 characters): a short one like c0b3e2f makes the app checkout fail later.
          if [[ "$APP_REF" =~ ^[0-9a-fA-F]{4,39}$ || "$APP_REF" =~ ^[0-9a-fA-F]{41,}$ ]]; then echo "::error::app_ref '$APP_REF' looks like a shortened commit ID. Use the full 40-character commit ID, or a branch or tag name (like main)."; exit 1; fi
          [[ -z "$EXPECTED_INPUT" || "$EXPECTED_INPUT" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Bad expected_version (like 0.12 or 0.12.1, or empty)"; exit 1; }
      - name: Get the tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get the app (${{ env.APP_REF }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app
          persist-credentials: false
      - name: Check the app version
        id: ver
        run: bash ci/app-version.sh app "$EXPECTED_INPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Playwright (no browsers needed; it drives the emulator's Chrome)
        run: npm ci
      - name: Start the local test server
        run: bash ci/start-server.sh app "$APP_PORT"
      - name: Turn on hardware speed-up for the emulator (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30 || true
          # Check that KVM is really usable before starting the emulator. (In run 41005227489 this job's copy of the
          # step was missing its last two lines, so the negative-check emulator ran without KVM: a 13-minute boot and
          # a Chrome start that timed out.)
          ls -l /dev/kvm || true
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then echo "KVM hardware speed-up is ready."; else echo "::error::KVM hardware speed-up is not usable on this runner, so the emulator would be far too slow to test with."; exit 1; fi
      - name: Negative check in the Android emulator's Chrome (google_apis image)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          EXPECTED_VERSION: ${{ steps.ver.outputs.version }}
          ANDROID_IMAGE: google_apis
          ANDROID_OUT: results/android-neg-crash
          NEG_PORT: "8932"
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          ram-size: 4096M
          heap-size: 576M
          # Same emulator settings as the main Android job (see the comment there).
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -feature -Vulkan
          script: bash ci/android-checks.sh negative
      - name: Save the emulator's own crash files (only if something failed)
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-neg-crash-emulator-files
          path: /tmp/android-runner/
          retention-days: 7
          if-no-files-found: ignore
      - name: Save screenshots and test files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-neg-crash
          path: results/
          retention-days: 7
          if-no-files-found: ignore

  iphone-simulator:
    name: iPhone checks (macOS) — WebKit, plus real Safari in the iOS Simulator
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check the inputs
        id: inputs
        # Typed-in inputs reach scripts only through env. Reject anything that isn't a plain ref or version number.
        run: |
          [[ "$APP_REF" =~ ^[A-Za-z0-9._/-]{1,100}$ && "$APP_REF" != -* && "$APP_REF" != *..* ]] || { echo "::error::Bad app_ref (letters, digits, . _ / - only, up to 100)"; exit 1; }
          # A commit must be given in full (40 characters): a short one like c0b3e2f makes the app checkout fail later.
          if [[ "$APP_REF" =~ ^[0-9a-fA-F]{4,39}$ || "$APP_REF" =~ ^[0-9a-fA-F]{41,}$ ]]; then echo "::error::app_ref '$APP_REF' looks like a shortened commit ID. Use the full 40-character commit ID, or a branch or tag name (like main)."; exit 1; fi
          [[ -z "$EXPECTED_INPUT" || "$EXPECTED_INPUT" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Bad expected_version (like 0.12 or 0.12.1, or empty)"; exit 1; }
      - name: Get the tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get the app (${{ env.APP_REF }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app
          persist-credentials: false
      - name: Check the app version
        id: ver
        run: bash ci/app-version.sh app "$EXPECTED_INPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Playwright WebKit
        run: |
          npm ci
          npx playwright install webkit
      - name: Start the local test server
        run: bash ci/start-server.sh app "$APP_PORT"
      - name: Checklist in WebKit with iPhone settings (WebKit, not real Safari)
        env:
          ENGINE: webkit
          EXPECTED_VERSION: ${{ steps.ver.outputs.version }}
          APP_URL: http://localhost:${{ env.APP_PORT }}/witnessing-app/
          OUT: results/webkit-iphone
        run: node tests/run-browser.js
      # Test setup only: the Simulator now boots AFTER the WebKit checklist, not during it. In run 41003637168 the
      # WebKit step-1 tap timed out while the Simulator was booting on the same machine (cause not proven).
      - name: Boot an iPhone in the iOS Simulator (after the WebKit checks, so they don't share the machine with a boot)
        if: ${{ !cancelled() && steps.ver.outcome == 'success' }}
        continue-on-error: true   # screenshots only; the open step below warns if Safari can't be reached
        run: bash ci/ios-simulator.sh boot
      - name: Open in the iPhone simulator's Safari (screenshots only, not checked)
        id: simopen
        if: ${{ !cancelled() && steps.ver.outcome == 'success' }}
        continue-on-error: true   # screenshots only; a failure here shows as a warning below, not a failed job
        timeout-minutes: 8   # includes waiting for the boot to finish
        run: bash ci/ios-simulator.sh open
      - name: Warn if the Simulator screenshots are missing
        if: ${{ always() && steps.simopen.outcome == 'failure' }}
        run: echo "::warning::Could not open the app in the iPhone Simulator's Safari (screenshots only; does not affect pass/fail). Real-Safari screenshots are missing from this run."
      - name: Experimental, does not affect pass/fail — drive real Mobile Safari with safaridriver
        id: safari
        if: ${{ !cancelled() && steps.ver.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          EXPECTED_VERSION: ${{ steps.ver.outputs.version }}
          APP_URL: http://localhost:${{ env.APP_PORT }}/witnessing-app/
          OUT: results/ios-safari
          WD_URL: http://127.0.0.1:4444
        run: |
          sudo safaridriver --enable
          safaridriver -p 4444 > results/safaridriver.log 2>&1 &
          sleep 3
          node tests/ios-safari-smoke.js
      - name: Warn if the experimental Safari check failed
        if: ${{ always() && steps.safari.outcome == 'failure' }}
        run: echo "::warning::Experimental real-Safari check failed (does not affect pass/fail). See results/ios-safari and results/safaridriver.log."
      - name: Shut down the Simulator
        if: ${{ always() && steps.inputs.outcome == 'success' }}
        run: bash ci/ios-simulator.sh shutdown
      - name: Save screenshots and test files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-simulator
          path: results/
          retention-days: 7
          if-no-files-found: ignore

  live-smoke:
    name: Live site smoke check (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check the inputs
        id: inputs
        # Typed-in inputs reach scripts only through env. Reject anything that isn't a plain ref or version number.
        run: |
          [[ "$APP_REF" =~ ^[A-Za-z0-9._/-]{1,100}$ && "$APP_REF" != -* && "$APP_REF" != *..* ]] || { echo "::error::Bad app_ref (letters, digits, . _ / - only, up to 100)"; exit 1; }
          # A commit must be given in full (40 characters): a short one like c0b3e2f makes the app checkout fail later.
          if [[ "$APP_REF" =~ ^[0-9a-fA-F]{4,39}$ || "$APP_REF" =~ ^[0-9a-fA-F]{41,}$ ]]; then echo "::error::app_ref '$APP_REF' looks like a shortened commit ID. Use the full 40-character commit ID, or a branch or tag name (like main)."; exit 1; fi
          [[ -z "$EXPECTED_INPUT" || "$EXPECTED_INPUT" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Bad expected_version (like 0.12 or 0.12.1, or empty)"; exit 1; }
      - name: Get the tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get the app's main branch (to learn which version should be live)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.APP_REPO }}
          ref: main
          path: app
          persist-credentials: false
      - name: Check the version on main
        id: ver
        # The typed-in expected version only applies here when the run is testing main.
        run: |
          if [[ "$APP_REF" == "main" ]]; then
            bash ci/app-version.sh app "$EXPECTED_INPUT"
          else
            bash ci/app-version.sh app
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Open the live site (Chromium and WebKit), check the version, reopen offline
        env:
          EXPECTED_VERSION: ${{ steps.ver.outputs.version }}
          LIVE_URL: https://tallcedar-apps.github.io/witnessing-app/
          OUT: results/live-smoke
        run: node tests/live-smoke.js
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-smoke
          path: results/
          retention-days: 7
          if-no-files-found: ignore
